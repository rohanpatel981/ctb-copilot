[project]
name = "ctb-copilot"
version = "0.1.0"
description = "Plug-and-play Q&A copilot over consolidated trial balance Excel files for CA firms."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Rohan Patel" }]
dependencies = [
    "anthropic>=0.92",
    "duckdb>=1.1",
    "polars>=1.12",
    "python-calamine>=0.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.12",
    "streamlit>=1.40",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "sqlglot>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
ctb-api = "ctb_copilot.api:run"
ctb-ui = "ctb_copilot.ui:run"
ctb-eval = "ctb_copilot.eval.runner:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctb_copilot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
